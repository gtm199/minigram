# Render Blueprint (free plan). Assumes the Git repo root contains backend/ and mobile/.
databases:
  - name: minigram-db
    databaseName: minigram
    user: minigram
    plan: free

services:
  - type: web
    name: minigram-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minigram-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
